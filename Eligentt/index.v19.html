<!-- ════════════════════════════════════════
     BOOTSTRAP — Single entry point.
     AppBootstrap orchestrates: config → EventBus → Stores → RPC → Wallet → UI → Ready
     ════════════════════════════════════════ -->
<script src="/shared/appBootstrap.js"></script>

<script type="module">
  // Phase 19: Pure Modular Runtime Bootstrap
  (function () {
    'use strict';

    function boot() {
      console.log('[Elligentt v19] Pure Modular Runtime — booting...');

      // 1. Set PURE_MODULAR mode
      try {
        if (typeof RuntimeMode !== 'undefined') {
          RuntimeMode.setMode('PURE_MODULAR');
          console.log('[Elligentt v19] RuntimeMode: PURE_MODULAR');
        }
      } catch (e) {
        console.warn('[Elligentt v19] RuntimeMode unavailable:', e.message);
      }

      // 2. Activate PureExecutionGuard
      try {
        if (typeof PureExecutionGuard !== 'undefined') {
          PureExecutionGuard.activate();
          var blockedCount = Object.keys(PureExecutionGuard.BLOCK_MAP).length;
          console.log('[Elligentt v19] PureExecutionGuard: ACTIVE — blocking ' + blockedCount + ' legacy functions');
        }
      } catch (e) {
        console.warn('[Elligentt v19] PureExecutionGuard unavailable:', e.message);
      }

      // 3. Start PureRuntimeValidator
      try {
        if (typeof PureRuntimeValidator !== 'undefined') {
          PureRuntimeValidator.start();
          console.log('[Elligentt v19] PureRuntimeValidator: ACTIVE');
        }
      } catch (e) {
        console.warn('[Elligentt v19] PureRuntimeValidator unavailable:', e.message);
      }

      // 4. Auto-register GlobalRegistryV2
      try {
        if (typeof GlobalRegistryV2 !== 'undefined') {
          GlobalRegistryV2.autoRegister();
          console.log('[Elligentt v19] GlobalRegistryV2: ' + GlobalRegistryV2.getRegisteredCount() + ' modules registered');
        }
      } catch (e) {
        console.warn('[Elligentt v19] GlobalRegistryV2 unavailable:', e.message);
      }

      // 5. Activate EventDelegator (handles all data-action)
      try {
        if (typeof EventDelegator !== 'undefined') {
          EventDelegator.activate();
          console.log('[Elligentt v19] EventDelegator: ACTIVE — ' + EventDelegator.getActionCount() + ' actions');
        }
      } catch (e) {
        console.warn('[Elligentt v19] EventDelegator unavailable:', e.message);
      }

      // 6. Run migration audit
      try {
        if (typeof FinalLegacyAudit !== 'undefined') {
          var audit = FinalLegacyAudit.audit();
          console.log('[Elligentt v19] FinalLegacyAudit: ' + audit.summary.status);
        }
      } catch (e) {
        console.warn('[Elligentt v19] FinalLegacyAudit unavailable:', e.message);
      }

      // 7. Run LegacyPurgeAnalyzer
      try {
        if (typeof LegacyPurgeAnalyzer !== 'undefined') {
          var scan = LegacyPurgeAnalyzer.quickScan();
          console.log('[Elligentt v19] LegacyPurgeAnalyzer: ' + scan.legacyFunctions + ' legacy fns, ' + scan.globals + ' globals, ' + scan.inlineHandlers + ' inline handlers');
        }
      } catch (e) {
        console.warn('[Elligentt v19] LegacyPurgeAnalyzer unavailable:', e.message);
      }

      // 8. Boot ApplicationKernel
      try {
        if (typeof ApplicationKernel !== 'undefined') {
          ApplicationKernel.boot();
        }
      } catch (e) {
        console.warn('[Elligentt v19] ApplicationKernel boot failed:', e.message);
      }

      // 9. Boot SystemManager
      try {
        if (typeof SystemManager !== 'undefined') {
          SystemManager.boot();
        }
      } catch (e) {
        console.warn('[Elligentt v19] SystemManager boot failed:', e.message);
      }

      // 10. Start AppBootstrap
      try {
        if (typeof AppBootstrap !== 'undefined') {
          AppBootstrap.start({
            onReady: function (report) {
              console.log('[Elligentt v19] AppBootstrap: READY — ' + (report.totalTime || 0).toFixed(0) + 'ms');
              _finalizeBoot();
            }
          });
        } else {
          _finalizeBoot();
        }
      } catch (e) {
        console.warn('[Elligentt v19] AppBootstrap start failed:', e.message);
      }
    }

    function _finalizeBoot() {
      // 11. Emit Phase 19 boot complete
      try {
        if (typeof EventBus !== 'undefined') {
          EventBus.emit('PHASE19_BOOT_COMPLETE', {
            version: '19.0.0',
            mode: 'PURE_MODULAR',
            timestamp: Date.now(),
            runtimeMode: typeof RuntimeMode !== 'undefined' ? RuntimeMode.getSummary() : null,
            guardActive: typeof PureExecutionGuard !== 'undefined' ? PureExecutionGuard.isActive() : false
          });
        }
      } catch (e) {}

      // 12. Print certification
      try {
        if (typeof Phase19FinalCertification !== 'undefined') {
          setTimeout(function () {
            Phase19FinalCertification.printReport();
          }, 1000);
        }
      } catch (e) {}

      // 13. Run tests (in development)
      try {
        if (typeof Phase19TestSuite !== 'undefined' && typeof ProductionConfig !== 'undefined' && !ProductionConfig.isProduction) {
          setTimeout(function () {
            console.log('[Elligentt v19] Running test suite...');
            Phase19TestSuite.runAll();
          }, 2000);
        }
      } catch (e) {}

      console.log('[Elligentt v19] PURE MODULAR RUNTIME ACTIVE — NO LEGACY FALLBACK');
    }

    // Wait for DOM
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
</script>
